<div class="p-6 max-w-5xl mx-auto animate-in fade-in duration-500">
  <div class="mb-8">
    <h1 class="text-3xl font-black text-gray-900 tracking-tight">Doctor Administration</h1>
    <p class="text-gray-500 mt-2 font-medium">Manage your professional profile.</p>
  </div>

  <div class="flex border-b border-gray-100 mb-8 overflow-x-auto" role="tablist" aria-label="Doctor profile sections">
    <button type="button" role="tab" aria-selected="true"
      class="px-8 py-4 font-bold text-sm uppercase tracking-widest border-b-4 border-blue-600 text-blue-600 whitespace-nowrap">
      Professional info
    </button>
  </div>

  @if (isLoading()) {
    <div class="bg-white rounded-3xl p-12 border border-gray-100 shadow-soft flex items-center justify-center gap-3 text-gray-500">
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-blue-200 border-t-blue-600"></span>
      <span class="font-bold">Loading your profile...</span>
    </div>
  } @else if (loadError()) {
    <div class="bg-white rounded-3xl p-10 border border-rose-100 shadow-soft text-center">
      <h2 class="text-lg font-black text-gray-900">Profile could not be loaded</h2>
      <p class="mt-2 text-sm text-gray-500">{{ loadError() }}</p>
      <button type="button" (click)="loadProfile()"
        class="mt-6 rounded-xl bg-gray-900 px-6 py-3 text-sm font-black uppercase tracking-wider text-white hover:bg-black">
        Try Again
      </button>
    </div>
  } @else {
    <form (ngSubmit)="savePersonal()" class="space-y-6 animate-in slide-in-from-bottom-4 duration-300">
        <div class="bg-white rounded-3xl p-8 border border-gray-100 shadow-soft">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-4">
              <div>
                <label for="doctor-name" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Full Name</label>
                <input id="doctor-name" name="name" type="text" required maxlength="200" [(ngModel)]="doctorInfo().name"
                  class="w-full bg-gray-50/50 border-gray-100 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all font-bold text-gray-800">
              </div>
              <div>
                <label for="doctor-title" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Qualifications / Degrees</label>
                <input id="doctor-title" name="title" type="text" maxlength="200" [(ngModel)]="doctorInfo().title" placeholder="e.g. MBBS, FCPS"
                  class="w-full bg-gray-50/50 border-gray-100 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all font-bold text-gray-800">
              </div>
              <div>
                <label for="doctor-specialty" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Specialty</label>
                <input id="doctor-specialty" name="specialty" type="text" maxlength="200" [(ngModel)]="doctorInfo().specialty"
                  class="w-full bg-gray-50/50 border-gray-100 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all font-bold text-gray-800">
              </div>
            </div>
            <div class="space-y-4">
              <div>
                <label for="doctor-registration" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Registration No.</label>
                <input id="doctor-registration" name="registration" type="text" required maxlength="50" [(ngModel)]="doctorInfo().regNo"
                  class="w-full bg-gray-50/50 border-gray-100 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all font-bold text-gray-800 uppercase">
              </div>
              <div>
                <label for="doctor-email" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Contact Email</label>
                <input id="doctor-email" name="email" type="email" required maxlength="200" [(ngModel)]="doctorInfo().email" autocomplete="email"
                  class="w-full bg-gray-50/50 border-gray-100 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all font-bold text-gray-800">
              </div>
              <div>
                <label for="doctor-phone" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Phone</label>
                <input id="doctor-phone" name="phone" type="tel" required maxlength="50" [(ngModel)]="doctorInfo().phone" autocomplete="tel"
                  class="w-full bg-gray-50/50 border-gray-100 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all font-bold text-gray-800">
              </div>
            </div>
          </div>
          <div class="mt-6">
            <label for="doctor-bio" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Professional Summary</label>
            <textarea id="doctor-bio" name="bio" rows="4" maxlength="2000" [(ngModel)]="doctorInfo().bio"
              class="w-full bg-gray-50/50 border-gray-100 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all font-medium text-gray-800 resize-none"></textarea>
          </div>
          <div class="mt-8 flex justify-end">
            <button type="submit" [disabled]="isSaving()"
              class="inline-flex min-w-48 items-center justify-center gap-2 bg-gray-900 hover:bg-black disabled:cursor-not-allowed disabled:opacity-60 text-white px-10 py-4 rounded-2xl font-black text-sm uppercase tracking-widest shadow-xl transition-all active:scale-95">
              @if (isSaving()) {
                <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
                Saving...
              } @else {
                Save Changes
              }
            </button>
          </div>
        </div>
    </form>
  }
</div>
